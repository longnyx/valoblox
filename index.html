
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALOBLOX</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: #fff;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.screen {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: #000;
}

.message {
    display: none;
    color: white;
    animation: appear 0.5s ease;
}

.message h1 {
    font-size: 25px;
    font-weight: 500;
}

.message p {
    font-size: 13px;
    margin-top: 12px;
    color: #fff;
    letter-spacing: 1px;
}

@keyframes appear {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}
</style>
</head>

<body>

<div class="screen">

    <div class="message" id="author">
        <h1>By : icebrunexz</h1>
    </div>

    <div class="message" id="disclaimer">
        <h1>Esse site foi criado por um fã</h1>
        <p>NADA QUE TEM NESSE SITE É OFICIAL</p>
    </div>

</div>

<script>
const author = document.getElementById("author");
const disclaimer = document.getElementById("disclaimer");

setTimeout(() => {
    author.style.display = "block";
}, 5000);

setTimeout(() => {
    author.style.display = "none";
    disclaimer.style.display = "block";
}, 9000);

setTimeout(() => {
    disclaimer.style.display = "none";
}, 15000);
</script>

</body>
</html>
